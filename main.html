<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        /* Starting page */
        #start {
            margin-top: 50px;
        }

        #start h1 {
            font-size: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            width: 300px;
            margin: 30px auto;
            gap: 15px;
        }

        .form-group input {
            padding: 12px;
            font-size: 16px;
        }

        #submit {
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        /* Game page */
        #game {
            display: none;
        }

        #game h1 {
            font-family: cursive;
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0 20px;
        }

        .message {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .board {
            width: 470px;
            height: 470px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .cell {
            background-color: pink;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            font-family: cursive;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Initial Page -->
        <div id="start">

            <h1>Tic Tac Toe</h1>

            <div class="form-group">
                <input type="text" id="player-1" placeholder="Player 1 Name">
                <input type="text" id="player-2" placeholder="Player 2 Name">

                <button id="submit">Start Game</button>
            </div>

        </div>


        <!-- Game Page -->
        <div id="game">

            <h1>Tic Tac Toe</h1>

            <div class="message"></div>

            <div class="board">

                <div class="cell" id="1"></div>
                <div class="cell" id="2"></div>
                <div class="cell" id="3"></div>

                <div class="cell" id="4"></div>
                <div class="cell" id="5"></div>
                <div class="cell" id="6"></div>

                <div class="cell" id="7"></div>
                <div class="cell" id="8"></div>
                <div class="cell" id="9"></div>

            </div>

        </div>

    </div>


    <script>

        let player1 = "";
        let player2 = "";

        let currentPlayer = 1;

        let board = ["", "", "", "", "", "", "", "", ""];

        let gameOver = false;

        const submit = document.getElementById("submit");

        const start = document.getElementById("start");
        const game = document.getElementById("game");

        const player1Input = document.getElementById("player-1");
        const player2Input = document.getElementById("player-2");

        const message = document.querySelector(".message");

        const cells = document.querySelectorAll(".cell");


        // Start game
        submit.addEventListener("click", function () {

            player1 = player1Input.value.trim();
            player2 = player2Input.value.trim();

            if (player1 === "" || player2 === "") {
                alert("Please enter both player names");
                return;
            }

            start.style.display = "none";
            game.style.display = "block";

            message.textContent = player1 + ", you're up";
        });


        // Cell click
        cells.forEach(function (cell) {

            cell.addEventListener("click", function () {

                // Don't allow clicking an already-filled cell
                if (cell.textContent !== "" || gameOver) {
                    return;
                }

                let id = Number(cell.id);

                // Player 1
                if (currentPlayer === 1) {

                    cell.textContent = "X";
                    board[id] = "X";

                }

                // Player 2
                else {

                    cell.textContent = "O";
                    board[id] = "O";

                }


                // Check winner
                if (checkWinner()) {

                    if (currentPlayer === 1) {
                        message.textContent =
                            player1 + " congratulations you won!";
                    }
                    else {
                        message.textContent =
                            player2 + " congratulations you won!";
                    }

                    gameOver = true;

                    return;
                }


                // Check draw
                if (checkDraw()) {

                    message.textContent = "It's a draw!";

                    gameOver = true;

                    return;
                }


                // Change player
                if (currentPlayer === 1) {

                    currentPlayer = 2;

                    message.textContent = player2 + ", you're up";

                }
                else {

                    currentPlayer = 1;

                    message.textContent = player1 + ", you're up";

                }

            });

        });


        // Winning combinations
        function checkWinner() {

            const winningPatterns = [

                [1, 2, 3],
                [4, 5, 6],
                [7, 8, 9],

                [1, 4, 7],
                [2, 5, 8],
                [3, 6, 9],

                [1, 5, 9],
                [3, 5, 7]

            ];


            for (let i = 0; i < winningPatterns.length; i++) {

                let pattern = winningPatterns[i];

                let a = board[pattern[0]];
                let b = board[pattern[1]];
                let c = board[pattern[2]];

                if (a !== "" && a === b && b === c) {
                    return true;
                }

            }

            return false;
        }


        // Draw
        function checkDraw() {

            for (let i = 1; i <= 9; i++) {

                if (board[i] === "") {
                    return false;
                }

            }

            return true;
        }

    </script>

</body>
</html>
