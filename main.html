```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #submit {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        #submit:hover {
            background-color: #0056b3;
        }

        #game {
            display: none;
        }

        .message {
            font-size: 20px;
            margin: 20px 0;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            justify-content: center;
            margin: 20px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Player Name Form -->
        <div id="start">
            <h1>Tic Tac Toe</h1>

            <div class="form-group">
                <input type="text" id="player-1" placeholder="Enter Player 1 Name">

                <input type="text" id="player-2" placeholder="Enter Player 2 Name">

                <button id="submit">Start Game</button>
            </div>
        </div>

        <!-- Game -->
        <div id="game">
            <h1>Tic Tac Toe</h1>

            <div class="message"></div>

            <div class="board">
                <div class="cell" id="1"></div>
                <div class="cell" id="2"></div>
                <div class="cell" id="3"></div>
                <div class="cell" id="4"></div>
                <div class="cell" id="5"></div>
                <div class="cell" id="6"></div>
                <div class="cell" id="7"></div>
                <div class="cell" id="8"></div>
                <div class="cell" id="9"></div>
            </div>
        </div>

    </div>

    <script>
        const player1Input = document.getElementById("player-1");
        const player2Input = document.getElementById("player-2");
        const submit = document.getElementById("submit");

        const start = document.getElementById("start");
        const game = document.getElementById("game");

        const message = document.querySelector(".message");
        const cells = document.querySelectorAll(".cell");

        let player1 = "";
        let player2 = "";
        let currentPlayer = 1;
        let gameOver = false;

        let board = ["", "", "", "", "", "", "", "", ""];

        const winningPatterns = [
            [1, 2, 3],
            [4, 5, 6],
            [7, 8, 9],
            [1, 4, 7],
            [2, 5, 8],
            [3, 6, 9],
            [1, 5, 9],
            [3, 5, 7]
        ];

        submit.addEventListener("click", function () {

            player1 = player1Input.value.trim();
            player2 = player2Input.value.trim();

            if (player1 === "" || player2 === "") {
                alert("Please enter both player names");
                return;
            }

            start.style.display = "none";
            game.style.display = "block";

            message.textContent = player1 + ", you're up";
        });

        cells.forEach(function (cell) {

            cell.addEventListener("click", function () {

                if (gameOver || cell.textContent !== "") {
                    return;
                }

                let id = Number(cell.id);

                if (currentPlayer === 1) {
                    cell.textContent = "X";
                    board[id] = "X";
                } else {
                    cell.textContent = "O";
                    board[id] = "O";
                }

                if (checkWinner()) {
                    let winner;

                    if (currentPlayer === 1) {
                        winner = player1;
                    } else {
                        winner = player2;
                    }

                    message.textContent = winner + " congratulations you won!";
                    gameOver = true;
                    return;
                }

                if (isDraw()) {
                    message.textContent = "It's a draw!";
                    gameOver = true;
                    return;
                }

                if (currentPlayer === 1) {
                    currentPlayer = 2;
                    message.textContent = player2 + ", you're up";
                } else {
                    currentPlayer = 1;
                    message.textContent = player1 + ", you're up";
                }
            });
        });

        function checkWinner() {

            for (let i = 0; i < winningPatterns.length; i++) {

                let pattern = winningPatterns[i];

                let a = board[pattern[0]];
                let b = board[pattern[1]];
                let c = board[pattern[2]];

                if (a !== "" && a === b && b === c) {
                    return true;
                }
            }

            return false;
        }

        function isDraw() {

            for (let i = 1; i <= 9; i++) {
                if (board[i] === "") {
                    return false;
                }
            }

            return true;
        }
    </script>

</body>
</html>
